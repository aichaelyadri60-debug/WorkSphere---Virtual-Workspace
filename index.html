<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />

    <title>Workspace</title>
  </head>
  <body>
    <aside>
      <div class="controls">
        <input
          type="text"
          id="searchInput"
          placeholder="Search by name..."
          class="search-input"
          oninput="rechercheparnom()"
        />
      </div>

      <div class="containermembre"></div>
      <h1 style="color: rgb(42, 42, 42)" class="titre">aucun members</h1>
      <button id="addnewmember-btn" onclick="ajout()">
        ajouter un membre +
      </button>
    </aside>
    <main>
      <div class="conference box" data-zone="conference" >
        <div class="content">

        </div>
        <h3 class="nomzone">Salle de conférence</h3>
        <button class="plus" onclick="membredisponible('conference')"> + </button>
      </div>
      <div class=" emptyy" ></div>
      <div class=" emptyx" ></div>
      <div class="reception box" data-zone="reception">
      <h2 class="nomzone">Réception</h2><div class="content">

        </div>
        <button class="plus" onclick="membredisponible('reception')"> + </button>
      </div>
      <div class="server box" data-zone="server">
        <h3 class="nomzone">Salle des serveurs</h3>
                <div class="content">

        </div>
        <button class="plus" onclick="membredisponible('server')">+</button>
      </div>
      <div class="security box" data-zone="security">
        <h3 class="nomzone">Salle de sécurité</h3>
        <div class="content">

        </div>
        <button class="plus" onclick="membredisponible('security')">+</button>
      </div>
      <div class="staffroom box" data-zone="staffroom">
        <h3 class="nomzone">Salle du personnel</h3>
        <div class="content">

        </div>
        <button class="plus" onclick="membredisponible('staffroom')">+</button>
      </div>
      <div class="archive box" data-zone="archive">
        <h3 class="nomzone">Salle d’archives</h3>
        <div class="content">

        </div>
        <button class="plus" onclick="membredisponible('archive')">+</button>
      </div>

    </main>
      <div class="modaldisponible closes">
      </div>
    <div class="formmodal closes">
      <div class="close" onclick="closemodal()">X</div>

      <form id="form-member">
        <h2 class="modal-title">Add Worker</h2>

        <label for="nom">Name:</label>
        <input type="text" id="nom" class="nom" placeholder="Enter name" />

        <label for="roles">Role:</label>
        <select name="roles" id="roles" class="roles">
          <option value="Réceptionniste" data-zone="reception">Receptionist</option>
          <option value="Technicien IT" data-zone="server">IT Technician</option>
          <option value="Agent de sécurité" data-zone="security">Security Agent</option>
          <option value="Manager">Manager</option>
          <option value="Netoyage">Cleaning</option>
          <option value="Autre">Other</option>
        </select>

        <label for="image">Photo (URL):</label>
        <input
          type="url"
          id="image"
          class="image"
          placeholder="https://example.com/photo.jpg"
          oninput="loadimg()"
        />

        <img src="./defaultimg.png" class="photo-preview" id="photoPreview" alt="defaultimg"/>
    

        <div id="experience-container"></div>

        <button
          type="button"
          id="add-exp"
          class="add-exp-btn"
          onclick="ajoutexperience()"
        >
          Add Experience
        </button>

        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          class="email"
          placeholder="example@mail.com"
        />

        <label for="number">Phone:</label>
        <input
          type="tel"
          id="number"
          class="number"
          placeholder="+212 61814567"
        />

        <button id="ajout" type="submit" class="submit-btn">
          <b>Add Worker</b>
        </button>
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
